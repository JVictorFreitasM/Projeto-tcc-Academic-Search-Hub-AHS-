[project]
name = "academic-search-hub"
version = "0.1.0"
description = "Aplicação web para busca unificada em repositórios acadêmicos de acesso aberto (TCC UESPI)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]>=2",
    "alembic",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "defusedxml",
    "argon2-cffi",
    "PyJWT",
    "slowapi",
    "pyyaml>=6.0.3",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "pytest-cov",
    "ruff",
    "mypy",
    "bandit",
    "pip-audit",
    "playwright",
    "axe-playwright-python",
    "types-pyyaml>=6.0.12.20260906",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Testes podem usar assert (S101) e valores fixos que parecem senhas (S105, S106).
"tests/**" = ["S101", "S105", "S106", "E501", "RUF001"]
# Migrações carregam SQL literal em linhas longas.
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
# ignore_missing_imports só entra por biblioteca sem tipos, uma a uma, com comentário.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=html --cov-report=xml --cov-report=term"
markers = [
    "unit: testes unitários, sem rede nem banco",
    "integration: testes com banco de dados de teste",
    "contract: testes de contrato da API e dos conectores",
    "e2e: testes de ponta a ponta no navegador",
    "a11y: testes de acessibilidade",
]
